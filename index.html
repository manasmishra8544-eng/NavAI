
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>NavAI — Your AI Assistant</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">N</div>
        <div><strong>NavAI</strong><small>Your AI space</small></div>
      </div>

      <button class="new-chat" id="newChatBtn">＋ New chat</button>

      <div class="section-label">RECENT CHATS</div>
      <div id="historyList" class="history-list"></div>

      <div class="sidebar-bottom">
        <div class="profile">
          <div class="avatar">N</div>
          <div><strong>NavAI</strong><small>Personal assistant</small></div>
        </div>
        <button id="themeBtn" class="secondary-btn">☼ Toggle theme</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="Toggle sidebar">☰</button>
        <span class="topbar-title">NavAI <span class="online-dot"></span></span>
        <button id="clearBtn" class="secondary-btn">New conversation</button>
      </header>

      <section class="chat-area" id="chatArea">
        <div id="welcome" class="welcome">
          <div class="welcome-mark">N</div>
          <p class="eyebrow">YOUR PERSONAL AI ASSISTANT</p>
          <h1>What can I help you<br><span>with today?</span></h1>
          <p class="welcome-subtitle">Ask a question, explore an idea, or work through a problem.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Explain a difficult topic in simple words.">✦ Explain something</button>
            <button class="suggestion" data-prompt="Help me make a practical study timetable.">▤ Plan my day</button>
            <button class="suggestion" data-prompt="Help me write clean, working code for my project.">⌘ Help with coding</button>
            <button class="suggestion" data-prompt="Give me creative ideas for a new project.">✧ Brainstorm ideas</button>
          </div>
        </div>

        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="status" class="status" role="status"></div>
      </section>

      <footer class="composer-wrap">
        <form id="chatForm" class="composer">
          <textarea id="messageInput" rows="1" maxlength="8000"
            placeholder="Message NavAI..." aria-label="Message NavAI"></textarea>
          <div class="composer-bottom">
            <span class="composer-hint">Enter to send · Shift + Enter for a new line</span>
            <button id="sendBtn" type="submit" aria-label="Send message">↑</button>
          </div>
        </form>
        <p class="disclaimer">NavAI can make mistakes. Check important information.</p>
      </footer>
    </main>
  </div>
  <script src="/script.js"></script>
<script src="voice-system.js"></script>
</body>
</html>
